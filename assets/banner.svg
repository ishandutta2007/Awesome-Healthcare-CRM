<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="45%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0066cc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070c18" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Dynamic ECG Wave Pattern -->
    <style>
      @keyframes pulseEcg {
        0% { stroke-dashoffset: 1200; opacity: 0.3; }
        50% { opacity: 0.85; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }

      @keyframes pingGlow {
        0%, 100% { opacity: 0.2; transform: scale(0.98); }
        50% { opacity: 0.55; transform: scale(1.02); }
      }

      @keyframes beaconRing {
        0% { r: 5px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }

      .ecg-line {
        stroke-dasharray: 1200;
        animation: pulseEcg 6s linear infinite;
      }

      .floating-pill-1 {
        animation: floatSlow 4.5s ease-in-out infinite;
      }

      .floating-pill-2 {
        animation: floatReverse 5s ease-in-out infinite;
      }

      .floating-pill-3 {
        animation: floatSlow 5.5s ease-in-out infinite 0.8s;
      }

      .floating-pill-4 {
        animation: floatReverse 4.8s ease-in-out infinite 0.5s;
      }

      .beacon-circle {
        animation: beaconRing 2.6s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: 108px 68px;
      }

      .glow-layer {
        animation: pingGlow 4s ease-in-out infinite;
      }

      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.8px;
      }

      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }

      .badge-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #94a3b8;
      }
    </style>

    <!-- Drop Shadows -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00d2ff" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="280" fill="url(#bgGradient)" rx="16"/>
  <rect width="1000" height="280" fill="url(#glowPulse)" rx="16" class="glow-layer"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.35">
    <line x1="0" y1="56" x2="1000" y2="56"/>
    <line x1="0" y1="112" x2="1000" y2="112"/>
    <line x1="0" y1="168" x2="1000" y2="168"/>
    <line x1="0" y1="224" x2="1000" y2="224"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="250" y1="0" x2="250" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
    <line x1="900" y1="0" x2="900" y2="280"/>
  </g>

  <!-- Dynamic ECG Rhythm Line in background -->
  <path d="M 0 140 L 150 140 L 170 140 L 185 110 L 200 170 L 215 125 L 225 150 L 245 140 L 420 140 L 440 140 L 455 90 L 470 195 L 485 105 L 500 160 L 515 140 L 730 140 L 750 120 L 765 175 L 780 100 L 795 165 L 810 140 L 1000 140"
        fill="none" stroke="url(#heartGrad)" stroke-width="2.5" opacity="0.45" class="ecg-line"/>

  <!-- Left Dynamic Beacon Logo -->
  <g transform="translate(60, 48)">
    <circle cx="48" cy="48" r="44" fill="#0b1b36" stroke="url(#pillBorder)" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- Animated Beacon Rings -->
    <circle cx="48" cy="48" r="8" fill="none" stroke="#22d3ee" stroke-width="1.8" class="beacon-circle"/>
    <!-- Medical Cross with Heartbeat -->
    <path d="M 43 28 H 53 V 41 H 66 V 51 H 53 V 68 H 43 V 51 H 30 V 41 H 43 Z" fill="url(#titleGrad)"/>
    <circle cx="48" cy="46" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Ambient Dynamic Floating Badges (Placed safely away from center title) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(195, 30)">
    <rect width="138" height="28" rx="14" fill="#0f1f38" stroke="url(#pillBorder)" stroke-width="1.2" opacity="0.9" filter="url(#cardShadow)"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981"/>
    <text x="28" y="18" class="badge-font">🔒 HIPAA COMPLIANT</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(680, 32)">
    <rect width="128" height="28" rx="14" fill="#0f1f38" stroke="url(#pillBorder)" stroke-width="1.2" opacity="0.9" filter="url(#cardShadow)"/>
    <circle cx="16" cy="14" r="4.5" fill="#38bdf8"/>
    <text x="28" y="18" class="badge-font">⚡ HL7 / FHIR R4</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-3" transform="translate(195, 222)">
    <rect width="132" height="28" rx="14" fill="#0f1f38" stroke="url(#pillBorder)" stroke-width="1.2" opacity="0.9" filter="url(#cardShadow)"/>
    <circle cx="16" cy="14" r="4.5" fill="#818cf8"/>
    <text x="28" y="18" class="badge-font">🏥 PATIENT 360°</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-4" transform="translate(680, 222)">
    <rect width="136" height="28" rx="14" fill="#0f1f38" stroke="url(#pillBorder)" stroke-width="1.2" opacity="0.9" filter="url(#cardShadow)"/>
    <circle cx="16" cy="14" r="4.5" fill="#f59e0b"/>
    <text x="28" y="18" class="badge-font">🤖 CLINICAL AI BOTS</text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed in foreground & unobscured) -->
  <g transform="translate(190, 114)">
    <!-- Main Headline -->
    <text x="0" y="0" font-size="37" fill="url(#titleGrad)" class="banner-title" filter="url(#textGlow)">
      Awesome Healthcare CRM
    </text>
    
    <!-- Subtitle 1 -->
    <text x="2" y="32" font-size="15.5" fill="#f1f5f9" class="banner-sub" font-weight="600">
      The Curated Ecosystem for Patient Relationships, Care Coordination &amp; Clinical Workflows
    </text>

    <!-- Subtitle 2 / Description -->
    <text x="2" y="55" font-size="13" fill="#94a3b8" class="banner-sub">
      Enterprise SaaS Market Leaders • Production-Ready Open-Source EHR &amp; CRM Solutions
    </text>
  </g>

  <!-- Bottom Border Accent Line -->
  <rect x="0" y="276" width="1000" height="4" fill="url(#titleGrad)" rx="2"/>
</svg>
